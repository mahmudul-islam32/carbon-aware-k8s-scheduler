[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "carbon-scheduler"
dynamic = ["version"]
description = "Carbon-Aware Kubernetes Batch Scheduler"
readme = "README.md"
license = "MIT"
requires-python = ">=3.12"
authors = [
    { name = "Mahmudul Islam", email = "mahmudul@example.com" }
]
keywords = ["kubernetes", "carbon", "scheduler", "sustainability", "green-computing"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Intended Audience :: System Administrators",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Topic :: System :: Systems Administration",
    "Topic :: Scientific/Engineering",
]

dependencies = [
    "kopf>=1.37.0",
    "kubernetes>=29.0.0",
    "httpx>=0.27.0",
    "prometheus-client>=0.20.0",
    "pydantic>=2.6.0",
    "pydantic-settings>=2.2.0",
    "pyyaml>=6.0.1",
    "cachetools>=5.3.0",
    "click>=8.1.7",
    "rich>=13.7.0",
    "structlog>=24.1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=4.1.0",
    "pytest-httpx>=0.30.0",
    "respx>=0.21.0",
    "ruff>=0.3.0",
    "mypy>=1.8.0",
    "types-PyYAML>=6.0.0",
    "types-cachetools>=5.3.0",
]

[project.scripts]
carbon-scheduler = "carbon_scheduler.controller.main:main"
carbon-sim = "carbon_scheduler.sim.cli:main"

[project.urls]
Homepage = "https://github.com/mahmudul-islam32/carbon-aware-k8s-scheduler"
Repository = "https://github.com/mahmudul-islam32/carbon-aware-k8s-scheduler"
Documentation = "https://github.com/mahmudul-islam32/carbon-aware-k8s-scheduler/tree/main/docs"

# Single source of truth for the version (F-34); Chart.yaml is kept in sync by
# `python -m carbon_scheduler.release bump`.
[tool.hatch.version]
path = "src/carbon_scheduler/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/carbon_scheduler"]

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E",      # pycodestyle errors
    "W",      # pycodestyle warnings
    "F",      # Pyflakes
    "I",      # isort
    "B",      # flake8-bugbear
    "C4",     # flake8-comprehensions
    "UP",     # pyupgrade
    "ARG",    # flake8-unused-arguments
    "SIM",    # flake8-simplify
]
ignore = [
    "E501",   # line too long (handled by formatter)
    "B008",   # do not perform function calls in argument defaults
]

[tool.ruff.lint.isort]
known-first-party = ["carbon_scheduler"]

[tool.mypy]
python_version = "3.12"
strict = true
warn_return_any = true
warn_unused_ignores = true
disallow_untyped_defs = true
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = [
    "kopf.*",
    "kubernetes.*",
    "cachetools.*",
]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "-v --cov=carbon_scheduler --cov-report=term-missing"
