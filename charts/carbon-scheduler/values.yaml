# Default values for carbon-scheduler

replicaCount: 1

image:
  repository: ghcr.io/mahmudul-islam32/carbon-scheduler
  tag: ""  # Defaults to .Chart.AppVersion
  pullPolicy: IfNotPresent

imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""

serviceAccount:
  # Specifies whether a service account should be created
  create: true
  # Annotations to add to the service account
  annotations: {}
  # The name of the service account to use.
  # If not set and create is true, a name is generated using the fullname template
  name: ""

rbac:
  # Specifies whether RBAC resources should be created
  create: true

podAnnotations: {}

podSecurityContext:
  runAsNonRoot: true
  runAsUser: 1000
  runAsGroup: 1000
  fsGroup: 1000

securityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  capabilities:
    drop:
      - ALL

resources:
  limits:
    cpu: 500m
    memory: 256Mi
  requests:
    cpu: 100m
    memory: 128Mi

# Carbon scheduler configuration
config:
  # Window selection policy: immediate, threshold, greenest-window, balanced
  policy: greenest-window
  # Balanced policy: renewable-share points subtracted per hour of delay
  delayPenaltyPctPerHour: 2
  # Release staggering: max planned releases per minute (0 disables)
  maxReleasesPerMinute: 0
  # Threshold policy: release when forecast share >= this value
  renewableThresholdPct: 60
  # Maximum time a job may be held after submission ("" or "0" disables the cap)
  maxDelay: "24h"
  # Re-plan held jobs when a newer forecast arrives (F-20)
  replanEnabled: true
  # Move a plan only if the new window is greener by more than this (percentage points)
  replanMinImprovementPct: 3
  # Energy-Charts country code
  gridCountry: "de"
  # Base URL for Energy-Charts API
  gridApiBaseUrl: "https://api.energy-charts.info"
  # How often to refresh forecast data (minutes)
  forecastRefreshMinutes: 30
  # Safety margin before deadline (minutes)
  deadlineSafetyMarginMinutes: 5
  # How often to reconcile job states (seconds)
  reconcileIntervalSeconds: 60
  # Enable leader election for HA deployments
  leaderElection: true
  # Live CO2 accounting (estimates): intensity of the non-renewable share
  fossilIntensityGco2Kwh: 400
  # Estimated power draw per requested CPU core / GPU (watts)
  wattsPerCpuCore: 10
  wattsPerGpu: 200
  # Logging level
  logLevel: INFO
  # Log output format: json, console
  logFormat: json

# Emission factors configuration
emissionFactors:
  # Whether to use custom emission factors
  custom: false
  # Custom emission factors (used if custom: true)
  # Keys match Energy-Charts API production_types
  factors: {}

# Metrics configuration
metrics:
  enabled: true
  port: 9090
  service:
    type: ClusterIP
    annotations: {}
  serviceMonitor:
    enabled: false
    namespace: ""
    interval: 30s
    scrapeTimeout: 10s
    labels: {}

# Built-in web dashboard, served on the metrics port at / (JSON at /api/state).
# Reach it with: kubectl port-forward svc/<fullname>-metrics 9090  (e.g. carbon-scheduler-metrics)
dashboard:
  enabled: true

# Mutating admission webhook (F-21): sets spec.suspend=true on Jobs annotated
# flexible: "true" at creation, so users can't forget it. failurePolicy is always
# Ignore: if the webhook is down, Jobs are created unchanged (fail-open).
webhook:
  enabled: false
  port: 8443
  # Only send Jobs from namespaces labelled carbon-scheduler/enabled=true
  namespaceOptIn: false
  # Namespaces whose Jobs are never sent to the webhook
  excludeNamespaces:
    - kube-system
  timeoutSeconds: 5
  tls:
    # selfSigned: the chart generates a CA and serving certificate (reused on upgrade)
    # certManager: cert-manager issues the certificate and injects the CA bundle
    mode: selfSigned
    selfSigned:
      validityDays: 3650
    certManager:
      # Existing Issuer/ClusterIssuer, e.g. {kind: ClusterIssuer, name: my-ca}.
      # Empty creates a self-signed Issuer for the webhook.
      issuerRef: {}
      duration: 8760h
      renewBefore: 720h

# PrometheusRule alert pack (needs the Prometheus Operator CRDs)
alerts:
  enabled: false
  namespace: ""
  labels: {}
  # Fire when the forecast is older than this many seconds
  forecastStaleSeconds: 7200
  # Fire when more than this fraction of releases are fallbacks (over 1h)
  fallbackRatio: 0.5
  # Fire when this many jobs are held in one namespace
  heldJobsHigh: 50

# Grafana dashboard
grafana:
  enabled: false
  # Namespace where Grafana looks for dashboard ConfigMaps
  namespace: ""
  # Labels for Grafana sidecar discovery
  labels:
    grafana_dashboard: "1"

nodeSelector: {}

tolerations: []

affinity: {}

# Extra environment variables
extraEnv: []

# Extra volume mounts
extraVolumeMounts: []

# Extra volumes
extraVolumes: []
