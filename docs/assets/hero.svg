  <!-- submitted job (grey) -->
  <rect x="700.8" y="244" width="40.8" height="40" rx="8" fill="#94a3b8" fill-opacity="0.85"/>
  <text x="721.2" y="269" font-family="'Segoe UI', Inter, Helvetica, Arial, sans-serif" font-size="12" font-weight="700" fill="#0f172a" text-anchor="middle">Job</text>
  <text x="721.2" y="234" font-family="'Segoe UI', Inter, Helvetica, Arial, sans-serif" font-size="11" fill="#e2e8f0" text-anchor="middle">submitted</text>

  <!-- shift arrow -->
