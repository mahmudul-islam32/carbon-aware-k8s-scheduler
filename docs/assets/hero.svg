  <text x="818.2" y="252" font-family="'Segoe UI', Inter, Helvetica, Arial, sans-serif" font-size="12" font-weight="700" fill="#fde68a" text-anchor="middle">time-shift</text>

  <!-- released job (green) -->
  <rect x="894.8" y="244" width="40.8" height="40" rx="8" fill="#22c55e" stroke="#bbf7d0" stroke-width="2"/>
  <text x="915.2" y="269" font-family="'Segoe UI', Inter, Helvetica, Arial, sans-serif" font-size="12" font-weight="800" fill="#052e16" text-anchor="middle">Job</text>
